[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semillero-kb"
version = "0.1.0"
description = "Local-first research knowledge-base contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6,<7", "networkx>=3.6,<4"]

[project.scripts]
semillero-kb = "semillero_kb.cli:main"

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
